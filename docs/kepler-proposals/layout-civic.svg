<text x="14" y="1086" font-size="11" fill="#2a2540" font-family="Verdana, sans-serif">The new hall stands where the gold council dome is, replacing it and the clock-tower hall both. Civic Avenue runs 70 m from the arrivals side to its</text>
<text x="14" y="1101" font-size="11" fill="#2a2540" font-family="Verdana, sans-serif">forecourt between two rows of shops; the big family domes close the back in an arc.</text>
