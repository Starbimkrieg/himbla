<text x="14" y="904" font-size="11" fill="#55607a" font-family="Verdana, sans-serif">Dashed: the town's radius (115 m) and 0.85 of it. Red: the pad's flight disc. Thick cream lines: tunnels.</text>
<text x="14" y="926" font-size="11" fill="#2a2540" font-family="Verdana, sans-serif">Nine raised modules on hydraulic legs, chained in a shallow arc 100 m long, the orange commons module in the middle: the</text>
<text x="14" y="941" font-size="11" fill="#2a2540" font-family="Verdana, sans-serif">polar-station type. A promenade runs along the chain and a market court opens off it, under the commons' stair. Three domes anchor</text>
<text x="14" y="956" font-size="11" fill="#2a2540" font-family="Verdana, sans-serif">the ends and the back.</text>
