# Builds the desktop game for Windows, Linux and macOS and attaches the downloads to a GitHub
# Release. Runs when a version tag (v1.2.3) is pushed, or manually from the Actions tab.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: moon-runner-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            **Moon-Runner** — a comic-book momentum delivery game on the Moon. No browser needed.

            | System | Download | How to run |
            | --- | --- | --- |
            | Windows | `Moon-Runner-*-windows-portable.exe` | Double-click. If SmartScreen warns, click **More info → Run anyway** (the build isn't code-signed). |
            | Windows (zip) | `Moon-Runner-*-win-x64.zip` | Unzip anywhere, run `Moon-Runner.exe`. |
            | Linux | `Moon-Runner-*-linux-x86_64.AppImage` | `chmod +x` it, then run it. |
            | macOS | `Moon-Runner-*-mac-universal.zip` | Unzip, then right-click **Moon-Runner.app → Open**. If macOS says it's damaged, run `xattr -cr Moon-Runner.app` once (the build isn't notarized). |

            Controls are on the title screen and under **H** in game. **F11** toggles fullscreen.
