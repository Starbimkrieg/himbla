<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Spider Tank Lab</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05030c; color: #fff4e0; font: 12px monospace; overflow: hidden; }
    #info { position: fixed; left: 8px; top: 8px; background: #120a1ecc; padding: 6px 8px; border: 2px solid #ff2e88; white-space: pre-wrap; line-height: 1.5; }
    #info b { color: #ffd23f; }
    #info .dim { color: #b8a8d8; }
  </style>
</head>
<body>
  <!-- Dev-only: Zbornak's spider tank (npm run dev, then /tools/spidertank-lab.html). Not part of the build.
       Query: ?auto=0                         drive it yourself from the start (it drives itself until you press a key, and again
                                              after a few seconds without one): W ahead (it closes up past 25 m/s, unless climbing), S brakes and backs up (to 18 m/s), A/D turn, hold SPACE: the beam
              &demo=walk|run|skim|beam|fold   one part of the drive, looped, for screenshots (else the whole drive: walk, run, close
                                              up and skim, open out, stop and fire)
              &demo=climb|wall                round the crates on the circle; down the test lane: a crate, a 3.2 m step, 4.6 m and 9.5 m blocks, a 12 m wall
              &speed=m/s                      the pace for &demo=walk|run|climb|wall
              &cam=chase|side|front|rear|top|orbit     where the camera starts &dist=m &yaw=deg (from straight ahead) &pitch=deg &ui=0
       Looking round: drag to turn the camera round the tank, right-drag (or shift-drag) to slide what it looks at, wheel to zoom,
       H to stop it turning with the tank, R or double-click to put it back. P pauses, . steps one frame, [ and ] slow the clock.
       The flight recorder: every tick's time and input is kept from the page's load; F9 saves it as a .json (with the last 15 s of the
       tank's state, to read). Drop the file on the page to replay it, exactly, in the same lab (the camera, pause and slow still work):
              &replay=url                     replay a saved flight from a url (&replay=session: the one dropped on the page)
              &at=s                           start the replay there (run up to it unseen)
       The obstacle sweep, unseen and with fresh tanks, as a table (window.__sweep too); each row's link replays that case here:
              ?sweep                          every box from 8 sides at 4 and 12 m/s, and standing beside the tall ones
              ?sweep=quick                    the blocks only (20 on), from 4 sides at 10 m/s, one stand each (about a minute)
              &box=i,j                        only those boxes
              ?case=box,side,speed            one approach (side: eighths round from the box's own facing; it starts 14 m out from it)
              ?case=stand,box,side[,out]      standing beside a side, facing along it, out m from it (4.2) -->
  <div id="info"></div>
  <script type="module" src="./spidertank-lab.js"></script>
</body>
</html>
